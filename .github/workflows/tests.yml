name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: postgres://neon:npg@127.0.0.1:5432/neondb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: tests
        run: npm test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo ""
            echo "- Status: ${{ steps.tests.outcome }}"
            echo "- Coverage artifact: coverage-report"
            echo "- Coverage path: \`coverage/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test failure annotation
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::Review the failing test output and rerun npm test locally."
